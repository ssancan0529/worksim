<style>
:root{--bg:#f6f7f7;--card:#ffffff;--surface:#f0f3f2;--tx:#1e2c28;--mut:#53645d;--line:#d4ddd8;--pri:#245b47;--prit:#fff;--you:#245b47;--youbg:#f1f6f3;--ok:#23643e;--okbg:#edf7ef;--bad:#a43535;--badbg:#fff0f0;--code:#edf1ef;--mark:#f1edcd;--selected:#edf4ef;--focus:#477c66;color-scheme:light}
:root[data-theme="dark"]{--bg:#131a18;--card:#1c2622;--surface:#25322c;--tx:#edf3ef;--mut:#bac9c0;--line:#405248;--pri:#a7d5bb;--prit:#14291d;--you:#a7d5bb;--youbg:#202f27;--ok:#a8deb8;--okbg:#22382b;--bad:#ffc0ba;--badbg:#3c2928;--code:#15201b;--mark:#49452a;--selected:#293c31;--focus:#b8e3ca;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.65 'Segoe UI',system-ui,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:4px}button:disabled{cursor:not-allowed;opacity:.48}
.wrap{max-width:1100px;margin:auto;padding:0 32px 48px}.hd{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);margin-bottom:38px}.hd b{display:flex;align-items:center;gap:10px;font-size:23px;letter-spacing:-.6px}.brand-icon{display:grid;place-items:center;width:34px;height:34px;background:var(--pri);color:var(--prit);border-radius:9px;font-size:21px}.header-tools{display:flex;gap:14px;align-items:center}.chip,.tag{display:inline-block;font-size:12px;color:var(--mut);background:var(--surface);border:1px solid var(--line);padding:3px 9px;border-radius:6px}.theme-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);font-weight:500;margin:0}.theme-label select{font-size:13px;padding:6px 9px}
h1{font-size:clamp(32px,4.4vw,49px);line-height:1.16;letter-spacing:-1.6px;max-width:720px;margin:14px 0 20px}h2{font-size:23px;letter-spacing:-.4px;margin:0 0 12px;line-height:1.35}h3{font-size:18px;line-height:1.4;margin:0 0 9px}p{margin:0 0 12px}.mut,.saved,.step-label{font-size:14px;color:var(--mut);line-height:1.7}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--mut)}.hero-note{display:flex;gap:22px;flex-wrap:wrap;margin:22px 0 34px;color:var(--mut);font-size:13px}.hero-art{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:25px;margin:0 0 20px;box-shadow:none}.tag{margin-bottom:14px}.btn{display:block;width:100%;border:1px solid var(--pri);background:var(--pri);color:var(--prit);border-radius:8px;padding:12px 16px;font-size:15px;font-weight:650;margin-top:12px;transition:filter .15s}.btn:hover:not(:disabled){filter:brightness(.93)}.btn.ghost{background:transparent;color:var(--tx);border-color:var(--line)}.btn.ghost:hover:not(:disabled){background:var(--surface);filter:none}.back{border:0;background:none;color:var(--you);font-size:14px;padding:0;margin:0 0 22px}.navline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}.navline button{background:transparent;border:0;color:var(--you);font-weight:600;padding:6px}.footer{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);margin-top:34px;padding-top:22px}
.route-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.route{position:relative;display:grid;grid-template-columns:18px 1fr;gap:0 12px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:15px 16px;transition:border-color .15s}.route::before{content:'';grid-column:1;grid-row:1 / 4;width:17px;height:17px;border:1.5px solid var(--mut);border-radius:50%;margin-top:4px}.route.on{background:var(--selected);border:2px solid var(--you);padding:14px 15px}.route.on::before{content:'✓';display:grid;place-items:center;border-color:var(--you);background:var(--you);color:var(--prit);font-size:12px;font-weight:800}.route>span,.route>h3,.route>p{grid-column:2}.route>.eyebrow{display:none}.route h3{font-size:16px;margin:0 0 3px;font-weight:650;letter-spacing:0}.route p{font-size:13px;margin:0;color:var(--mut)}.route-status{font-size:11px;font-weight:650;color:var(--you);margin-top:6px}.route:not(.on) .route-status{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.tabs button{border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--tx);padding:9px 13px;font-size:14px}.tabs button.on{border:2px solid var(--you);padding:8px 12px;background:var(--selected);color:var(--tx);font-weight:650}.mission-grid,.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mission-grid .card{display:flex;flex-direction:column;align-items:flex-start}.mission-grid .btn{margin-top:auto}.mission-grid .tag{font-size:11px}.mission-grid h3{font-size:19px}.workspace{max-width:850px;margin:auto}.brief li{margin:9px 0}.bar{height:6px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:24px}.bar i{display:block;height:100%;background:var(--you)}.pathway{margin-top:24px;background:var(--card)}.pathway h3,.pathway strong{color:var(--tx)}.pathway .eyebrow{color:var(--mut)}.pathway ol{display:grid;grid-template-columns:1fr 1fr;gap:23px;padding-left:22px;margin:24px 0 0}.pathway li{padding-left:3px;color:var(--tx)}.pathway li span{display:block;font-size:13px;color:var(--mut);margin-top:7px}progress{display:block;width:100%;height:9px;accent-color:var(--you);margin:12px 0 16px;border:0;border-radius:8px;overflow:hidden;background:var(--surface)}progress::-webkit-progress-bar{background:var(--surface)}progress::-webkit-progress-value{background:var(--you);border-radius:8px}progress::-moz-progress-bar{background:var(--you)}
.you{background:var(--youbg);border:1px solid var(--you)}.mine{display:inline-block;color:var(--you);font-size:12px;font-weight:700;margin-bottom:15px}.you label{color:var(--tx)}label{display:block;margin:16px 0 7px;font-weight:600;font-size:15px}select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:7px}select{padding:10px 12px;max-width:100%}textarea{width:100%;min-height:160px;padding:14px;resize:vertical;font:14px/1.65 ui-monospace,Consolas,monospace}textarea.txt{min-height:96px;font:15px/1.65 'Segoe UI',system-ui,sans-serif}textarea::placeholder{color:var(--mut)}pre,.code{background:var(--code);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:15px;margin:12px 0;overflow:auto;font:13px/1.7 ui-monospace,Consolas,monospace}.compare .card{min-width:0}.compare pre{white-space:pre-wrap;overflow-wrap:anywhere}.review-row{padding:17px 0;border-bottom:1px solid var(--line)}.review-row p{white-space:pre-wrap}.evidence,.feedback{background:var(--surface);border-left:3px solid var(--you);padding:14px 17px;margin:12px 0;color:var(--tx)}.evidence p:last-child,.feedback p:last-child{margin-bottom:0}.help{margin-top:25px;border-style:dashed}.help details{border-top:1px solid var(--line);padding:13px 0}.help p{margin-top:12px}summary{cursor:pointer;font-weight:600;color:var(--you)}a{color:var(--you);text-underline-offset:3px}.res{padding:12px 14px;border-radius:7px;margin:10px 0;font-size:14px}.res strong{display:block}.res.ok{background:var(--okbg);color:var(--ok)}.res.no{background:var(--badbg);color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}td,th{border:1px solid var(--line);padding:8px;text-align:left;color:var(--tx)}th{background:var(--surface)}
@media(max-width:650px){.wrap{padding:0 18px 32px}.hd{align-items:flex-start;margin-bottom:28px;gap:14px}.header-tools{flex-direction:column;gap:8px;align-items:flex-end}.header-tools>.chip{display:none}.theme-label{font-size:12px;gap:5px}.theme-label select{max-width:110px;font-size:12px}h1{letter-spacing:-1px}.card{padding:20px}.route-grid,.compare,.mission-grid{grid-template-columns:1fr}.route-grid{gap:9px}.route{padding:12px 14px}.route.on{padding:11px 13px}.pathway ol{grid-template-columns:1fr;gap:18px}.hero-note{gap:10px 17px}.footer{flex-direction:column}.tabs button{flex:1}.navline{gap:7px}}
.confidence{padding:0;border:0;margin:0 0 24px;min-width:0}.confidence legend{font-size:15px;font-weight:650;margin-bottom:14px;padding:0;color:var(--tx)}.confidence-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.confidence-choice{position:relative;margin:0;cursor:pointer;font-weight:500}.confidence-choice input{position:absolute;opacity:0;width:1px;height:1px}.confidence-face{display:flex;position:relative;flex-direction:column;align-items:center;gap:5px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:14px 5px 21px;background:var(--card);color:var(--mut);font-size:12px;line-height:1.4;min-height:99px}.confidence-face strong{font-size:21px;color:var(--tx);font-weight:650}.confidence-tick{position:absolute;bottom:4px;opacity:0;color:var(--you);font-size:12px;font-weight:800}.confidence-choice input:checked+.confidence-face{border:2px solid var(--you);padding:13px 4px 20px;background:var(--selected);color:var(--tx)}.confidence-choice input:checked+.confidence-face .confidence-tick{opacity:1}.confidence-choice input:focus-visible+.confidence-face{outline:3px solid var(--focus);outline-offset:3px}.confidence-choice:hover .confidence-face{border-color:var(--you)}@media(max-width:420px){.confidence-options{gap:5px}.confidence-face{font-size:10px;padding-left:3px;padding-right:3px;min-height:98px}.confidence-choice input:checked+.confidence-face{padding-left:2px;padding-right:2px}}
.history-tools{display:flex;align-items:center;flex-wrap:wrap;gap:5px 12px;margin:18px 0 4px;color:var(--mut)}.history-tools button{display:inline-flex;width:auto;align-items:center;gap:5px;background:transparent;border:0;border-radius:5px;color:var(--mut);font-size:13px;font-weight:500;padding:5px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}.history-tools button:hover{color:var(--tx);text-decoration-color:currentColor}.export-note{font-size:12px;line-height:1.6;color:var(--mut);margin-bottom:26px;max-width:620px}.format-note{font-size:11px}.next-step{margin-top:24px;text-align:left;padding:14px 18px;line-height:1.5}.history-tools+ .export-note{margin-top:0}@media(max-width:420px){.history-tools{gap:4px 9px}.history-tools button{font-size:12px}}
.progress-summary{margin:12px 0 16px;max-width:280px}.progress-summary .mut{font-size:12px}.progress-summary progress{height:5px;margin:4px 0 0}.small-note{font-size:12px}.mission-grid{margin-top:18px}.mission-grid .card{margin-bottom:0}.confidence{margin-top:12px}.area-tabs{margin:24px 0 8px}.active-role{font-size:12px;margin-bottom:20px}.mission-heading{justify-content:space-between;margin:18px 0 0}.mission-heading h2{margin:0}.mission-heading .learning-link{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px}.mission-heading .learning-link:hover{background:var(--surface);border-color:var(--you)}</style></head>

<div class="wrap">
  <div class="hd"><b><span class="brand-icon" aria-hidden="true">w.</span>WORKSIM</b><div class="header-tools"><span class="chip">Práctica · sin nota</span><label class="theme-label" for="appearance">Tema<select id="appearance"><option value="auto">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label></div></div>
  <div id="app"></div><footer class="footer"><span>WORKSIM · Proyecto i3lab</span><span>Practica con criterio. Crece con confianza.</span></footer>
</div>
<script>
let preference='auto';try{preference=localStorage.getItem('worksim-theme')||'auto'}catch{}
const themeMedia=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){document.documentElement.dataset.theme=preference==='auto'?(themeMedia.matches?'dark':'light'):preference;document.getElementById('appearance').value=preference}
applyTheme();themeMedia.addEventListener('change',()=>{if(preference==='auto')applyTheme()});
document.getElementById('appearance').onchange=e=>{preference=e.target.value;try{localStorage.setItem('worksim-theme',preference)}catch{}applyTheme()};

const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const routes={data:{title:'Datos y análisis',role:'Analista de datos junior',desc:'SQL, reportes y decisiones respaldadas por datos.',icon:'⌘'},marketing:{title:'Marketing y comunicación',role:'Asistente de marketing y comunicación',desc:'Campañas, mensajes y decisiones alineadas con la marca.',icon:'↗'}};
const missions=[
{id:'sql',route:'data',type:'compare',title:'El reporte correcto, antes de la reunión',time:'15 min',context:'Eres analista junior de Banco Horizonte, una empresa simulada. Tu líder necesita la segunda página de transferencias de Guayaquil para revisar alertas.',task:'Escribe una consulta SQL y explica cómo aseguras que la página corresponda al conjunto correcto.',facts:['Tabla: transacciones(id, tipo, ciudad, monto, sospechosa). Devuelve las cinco columnas. sospechosa vale 1 o 0.','Solo transferencias de Guayaquil. Hay al menos 25 que cumplen.','Sospechosas primero; empates por id ascendente. Página 2, de 10 en 10.'],ai:"SELECT * FROM (\n  SELECT * FROM transacciones LIMIT 10 OFFSET 10\n) AS pagina\nWHERE tipo = 'transferencia'\nORDER BY sospechosa DESC;",criteria:[['Filtrar el conjunto','El WHERE debe incluir tipo = transferencia y ciudad = Guayaquil antes de paginar.'],['Ordenar con estabilidad','ORDER BY sospechosa DESC, id ASC debe ordenar todo el conjunto filtrado.'],['Paginar al final','LIMIT 10 OFFSET 10 se aplica después de filtrar y ordenar.']],issues:'La IA omite la ciudad y pagina antes de filtrar y ordenar. Que una consulta se ejecute sin errores no demuestra que cumpla el pedido.',sample:"SELECT * FROM transacciones\nWHERE tipo = 'transferencia' AND ciudad = 'Guayaquil'\nORDER BY sospechosa DESC, id ASC\nLIMIT 10 OFFSET 10;",hint:'Piensa qué filas forman la lista completa antes de elegir su segunda página.'},
{id:'report',route:'data',type:'audit',title:'¿Los números cuentan toda la historia?',time:'12 min',context:'El equipo de Banco Horizonte preparó un informe con ayuda de IA. Debes revisarlo antes de enviarlo.',task:'Decide qué aceptar, corregir o verificar. Justifica cada decisión usando los datos del caso.',facts:['En septiembre: 200 solicitudes y 40 aprobaciones. En octubre: 300 solicitudes y 75 aprobaciones.','Son registros agregados de dos meses; no hay grupo de control ni datos sobre causas.','El informe debe distinguir cantidades, tasas y posibles explicaciones.'],claims:[['Las aprobaciones aumentaron 87,5 %: de 40 a 75.','accept','El cambio relativo es (75 − 40) / 40 × 100 = 87,5 %. La afirmación distingue cantidades.'],['La tasa de aprobación subió de 20 % a 25 %: un aumento de 5 %.','correct','Subió 5 puntos porcentuales; el aumento relativo de la tasa es 25 %. No son lo mismo.'],['La nueva campaña causó el aumento de aprobaciones.','verify','Los datos no permiten atribuir causalidad. Haría falta evidencia adicional; el informe no debe afirmarlo como un hecho.']],hint:'Comprueba los denominadores y separa lo que muestran los datos de las explicaciones posibles.'},
{id:'campaign',route:'marketing',type:'compare',title:'Una campaña que sí puedes cumplir',time:'15 min',context:'Eres asistente de marketing de Café Campus, una cafetería simulada cerca de una universidad. Debes proponer una campaña para la próxima semana.',task:'Propón un mensaje, un canal, una distribución del presupuesto y cómo medirías el resultado. Explica tus decisiones.',facts:['Público: estudiantes de 18 a 25 años. Objetivo: conseguir 30 canjes de un combo durante 7 días.','Presupuesto máximo: $120. No se permiten descuentos adicionales.','Combo autorizado: café y sánduche por $3,50, de lunes a viernes de 15:00 a 18:00, solo en el local.','Puedes usar Instagram y material impreso. No existen estudios sobre beneficios para la salud ni preferencias de los estudiantes.'],ai:'Publicaremos en Instagram: “La cafetería más saludable del campus. ¡50 % de descuento en todo, a cualquier hora!” Invertiremos $150 en anuncios y mediremos el éxito con los likes.',criteria:[['Oferta e información respaldada','Comunica el combo de $3,50, horario y canje en local. Evita descuentos y afirmaciones de salud sin evidencia.'],['Viabilidad','El total no debe superar $120. Justifica el canal según el público; no existe una única distribución correcta.'],['Medición alineada','Registra canjes durante los 7 días frente a la meta de 30. Los likes son una señal complementaria, no el objetivo.']],issues:'La IA inventa un beneficio de salud, ofrece un descuento no autorizado, omite las condiciones y supera el presupuesto. Además, mide likes en lugar de canjes.',sample:'Instagram y un cartel en el local: “Tu pausa entre clases: café + sánduche por $3,50. De lunes a viernes, de 15:00 a 18:00. Disponible en Café Campus”. Destinar $80 a difusión y $40 a impresión. Registrar canjes por día durante 7 días y compararlos con la meta de 30. Es una alternativa posible; el reparto requiere validar costos.',hint:'Revisa si cada promesa está autorizada y si tu indicador mide el objetivo del encargo.'},
{id:'message',route:'marketing',type:'audit',title:'Antes de publicar, revisa la promesa',time:'12 min',context:'Trabajas en comunicación de Aula Abierta, una organización simulada. La IA redactó textos para promocionar un taller.',task:'Revisa cada fragmento sin asumir que todos tienen errores. Explica tu decisión y qué cambiarías o verificarías.',facts:['Taller introductorio de Excel: sábado 14 de noviembre de 2026, de 10:00 a 12:00, en línea.','20 cupos, inscripción gratuita. No incluye certificado ni ofrece empleo.','Público: universitarios sin experiencia previa. No se recogieron testimonios ni estadísticas de resultados.'],claims:[['Aprende los primeros pasos de Excel. Taller gratuito en línea, sábado 14 de noviembre de 10:00 a 12:00. Hay 20 cupos.','accept','El mensaje coincide con los datos del brief y es adecuado para principiantes.'],['Recibe tu certificado y consigue empleo garantizado al terminar.','correct','El brief excluye certificado y empleo. Retira ambas promesas.'],['El 95 % de nuestros participantes recomienda el taller.','verify','No existe una encuesta que respalde el dato. No debe publicarse sin una fuente válida; mientras tanto, elimina la cifra.']],hint:'Distingue información confirmada, promesas que contradicen el brief y afirmaciones que necesitan una fuente.'}
];
missions.push(
{id:'data-dialogue',route:'data',type:'compare',title:'Cuando el pedido necesita una aclaración',time:'12 min',context:'Tu jefe de Banco Horizonte pide un reporte para hoy a las 16:00. Son las 15:00 y la fuente de datos seguirá fuera de servicio hasta mañana a las 09:00.',task:'Redacta un mensaje profesional para aclarar el límite, explicar el riesgo y proponer opciones. No inventes cifras.',facts:['El jefe pide cifras actualizadas y verificadas de hoy.','Solo tienes una copia de ayer, que no contiene las operaciones de hoy.','La fuente se restablece mañana a las 09:00. Nadie puede confirmar hoy las cifras faltantes.','Puedes entregar un borrador claramente fechado con datos de ayer o acordar la entrega verificada de mañana.'],ai:'Claro, entregaré hoy a las 16:00 las cifras actualizadas y verificadas. Usaré la copia de ayer como si fuera de hoy para cumplir.',criteria:[['Explicar la incompatibilidad','La fuente de hoy no está disponible; la copia de ayer no puede cumplir el requisito de actualidad.'],['Comunicar el riesgo','No prometas verificación ni presentes cifras antiguas como actuales. Explica la limitación sin culpar.'],['Proponer alternativas','Ofrece el borrador fechado o acuerda la entrega después del restablecimiento. Pide confirmar la prioridad.']],issues:'La IA acepta una promesa imposible y propone ocultar la antigüedad de los datos. Una respuesta profesional debe plantear el límite y negociar una alternativa.',sample:'Para entregar cifras verificadas de hoy necesito la fuente que se restablece mañana a las 09:00. Hoy a las 16:00 puedo enviar un borrador con datos de ayer, claramente fechado. Si es indispensable que incluya hoy, propongo acordar la entrega tras validar la fuente mañana. ¿Cuál opción priorizamos?',hint:'Distingue el resultado que se pide de la información con la que realmente cuentas.'},
{id:'marketing-dialogue',route:'marketing',type:'compare',title:'Una promesa que no debes publicar',time:'12 min',context:'Tu jefa te pide publicar hoy una campaña de un curso que garantice empleo al terminar.',task:'Escribe un mensaje para tu jefa: explica el problema de la promesa, ofrece una alternativa y solicita la decisión necesaria antes de publicar.',facts:['La organización no ofrece colocación laboral ni contratos con empleadores.','El curso sí incluye 8 horas de práctica y revisión de CV.','No hay estadísticas verificadas de inserción laboral.','La publicación debe comunicar solo beneficios confirmados.'],ai:'Lo publicaremos como empleo 100 % garantizado. Si alguien pregunta, diremos que era una frase motivacional.',criteria:[['Reconocer la contradicción','No existe un servicio ni evidencia que sostenga la garantía de empleo.'],['Explicar el riesgo con respeto','Señala que la promesa puede generar expectativas incumplibles; no basta con llamarla motivacional.'],['Ofrecer una opción viable','Propón destacar las 8 horas de práctica y la revisión de CV; pide aprobación de un mensaje sustentado.']],issues:'La IA acepta una garantía sin respaldo y propone justificarla después. Debes cuestionar el requerimiento, comunicar el riesgo y ofrecer una alternativa concreta.',sample:'Antes de publicar, sugiero retirar la garantía de empleo: no ofrecemos colocación ni tenemos evidencia que la sostenga. Podemos destacar las 8 horas de práctica y la revisión de CV. Así comunicamos beneficios confirmados. ¿Apruebas esta versión para avanzar hoy?',hint:'Puedes cuestionar una solicitud y mantener un tono profesional al mismo tiempo.'}
);
let history=[];try{history=JSON.parse(localStorage.getItem('worksim-learning-v2')||'[]');if(!Array.isArray(history))history=[]}catch{}
let state={view:'home',route:'data',id:null,step:0,mode:'independent'};let drafts={};try{drafts=JSON.parse(localStorage.getItem('worksim-drafts-v5')||'{}')}catch{}
const saveDrafts=()=>{try{localStorage.setItem('worksim-drafts-v5',JSON.stringify(drafts))}catch{}};
const current=()=>missions.find(m=>m.id===state.id);const draft=()=>drafts[state.id];
const btn=(text,action,disabled=false)=>`<button class="btn" data-action="${action}" ${disabled?'disabled':''}>${text}</button>`;
const scale=(key,value)=>`<fieldset class="confidence"><legend>${key==='before'?'Antes de empezar':'Al terminar'}: ¿qué tan seguro/a te sientes evaluando una propuesta de IA?</legend><div class="confidence-options">${[1,2,3,4,5].map(n=>`<label class="confidence-choice"><input type="radio" name="${key}" data-confidence="${key}" value="${n}" ${String(value)===String(n)?'checked':''}><span class="confidence-face"><strong>${n}</strong><span>${['Nada seguro/a','Poco seguro/a','Algo seguro/a','Seguro/a','Muy seguro/a'][n-1]}</span><span class="confidence-tick" aria-hidden="true">✓</span></span></label>`).join('')}</div></fieldset>`;
function home(){const list=missions.filter(m=>m.route===state.route),n=list.filter(completed).length;return `<div class="eyebrow">PRÁCTICA PROFESIONAL · SIN NOTA</div><h1>Primero tu criterio.<br>Después, la IA.</h1><p class="mut">Resuelve un caso laboral, contrasta la propuesta de la IA y comprueba tus decisiones.</p><div class="tabs area-tabs" aria-label="Área de práctica">${Object.entries(routes).map(([k,r])=>`<button data-route="${k}" class="${state.route===k?'on':''}" aria-pressed="${state.route===k}">${r.title}</button>`).join('')}</div><p class="mut active-role">${routes[state.route].role}</p><div class="navline mission-heading"><h2>Elige una misión</h2><button class="learning-link" data-action="learning">Mi aprendizaje →</button></div><div class="progress-summary"><span class="mut">${n} de ${list.length} misiones completadas</span><progress value="${n}" max="${list.length}" aria-label="Misiones completadas en ${routes[state.route].title}"></progress></div><div class="mission-grid">${list.map(m=>`<article class="card"><span class="tag">${m.type==='audit'?'Revisa una propuesta':'Resuelve y compara'}</span><h3>${m.title}</h3><p class="mut">${m.context}</p><p class="mut">A tu ritmo ${completed(m)?'· ✓ Completada':''}</p><button class="btn" data-start="${m.id}">${drafts[m.id]?'Continuar misión':completed(m)?'Volver a practicar':'Empezar misión'} →</button></article>`).join('')}</div><p class="mut small-note">Ambas áreas usan revisión independiente. Para comparar participantes, aplica la misma misión y registra el área elegida.</p>`}

function brief(m){return `<div class="card brief"><span class="tag">${routes[m.route].role} · Caso simulado</span><h2>${m.title}</h2><p>${m.context}</p><h3>Tu encargo</h3><p>${m.task}</p><details open><summary>Brief y evidencias disponibles</summary><ul>${m.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></details></div>`}
function field(key,label,value,placeholder=''){return `<label for="${key}">${label}</label><textarea id="${key}" class="txt" data-field="${key}" placeholder="${placeholder}">${esc(value)}</textarea>`}
function ready(){let m=current(),d=draft();if(state.step===0)return !!d.before&&(m.type==='compare'?d.answer.trim():d.decisions.every(Boolean)&&(d.auditReason||'').trim());if(state.step===1&&m.type==='compare')return d.compare.trim();if(state.step===2)return !!d.after;return true}
function exercise(){const m=current(),d=draft(),audit=m.type==='audit';let body=state.step===2?`<details class="card"><summary>Releer el encargo y las evidencias</summary>${brief(m)}</details>`:brief(m);if(state.step===0){body+=`<div class="card you"><span class="mine">Tu turno · ${audit?'Revisión independiente':'Primero, tu propuesta'}</span>${scale('before',d.before)}${audit?auditEntries(m,d).map(({c,i},j)=>`<div class="review-row"><h3>Fragmento ${j+1} · Propuesta de IA</h3><p>${esc(c[0])}</p><label for="decision${i}">¿Qué harías?</label><select id="decision${i}" data-decision="${i}"><option value="">Selecciona</option>${[['accept','Aceptar'],['correct','Corregir'],['verify','Verificar antes de usar']].map(([v,l])=>`<option value="${v}" ${d.decisions[i]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')+field('auditReason','Justifica tus decisiones en conjunto con evidencia del brief',d.auditReason||''):field('answer','Tu propuesta',d.answer,m.id==='sql'?'SELECT ...':'Mensaje, canal, presupuesto y medición...')+`<details><summary>Agregar una justificación (opcional)</summary>${field('reason','¿Por qué elegiste esta solución?',d.reason)}</details>`}</div>${btn(audit?'Ver retroalimentación':'Guardar mi intento y ver la IA','next',!ready())}<p class="mut">${audit?'Puede haber fragmentos correctos. Evalúa cada uno por su evidencia.':'Tu primer intento quedará visible para comparar; no necesitas tenerlo perfecto.'}</p>`}
if(state.step===1){if(audit){body+=`<div class="card"><span class="tag">Retroalimentación basada en el caso</span><h2>Revisa tus decisiones</h2>${auditEntries(m,d).map(({c,i},j)=>`<div class="feedback"><h3>Fragmento ${j+1}: ${d.decisions[i]===c[1]?'tu decisión coincide con la evidencia':'hay algo que revisar'}</h3><p>Elegiste: <strong>${{accept:'Aceptar',correct:'Corregir',verify:'Verificar'}[d.decisions[i]]}</strong>. Criterio del caso: <strong>${{accept:'Aceptar',correct:'Corregir',verify:'Verificar antes de usar'}[c[1]]}</strong>.</p><p>${c[2]}</p></div>`).join('')}<p class="mut">Se contrastan tus decisiones con el brief. Tu justificación conjunta queda guardada; su calidad no se califica automáticamente.</p></div>${btn('Aplicar lo aprendido','revise')}`}else{body+=`<div class="compare"><div class="card"><h3>Tu primer intento</h3><pre>${esc(d.answer)}</pre>${d.reason?`<p class="mut">Tu razonamiento: ${esc(d.reason)}</p>`:''}</div><div class="card"><h3>Propuesta de la IA</h3><pre>${esc(m.ai)}</pre><span class="tag">Ejemplo preparado para la práctica</span></div></div>${m.id==='sql'?sandbox(d):''}<div class="card you"><span class="mine">Tu turno · Contrasta con evidencia</span>${field('compare','¿Qué conservarías, corregirías o verificarías en cada propuesta?',d.compare)}<p class="mut">Entrega primero tu diagnóstico. Los criterios detallados y la revisión se muestran después.</p></div>${btn('Ver retroalimentación y mejorar','revise',!ready())}`}}
if(state.step===2){body+=`<div class="card"><span class="tag">Segunda oportunidad</span><h2>${audit?'Mejora el trabajo revisado':'Del primer intento a una mejor propuesta'}</h2>${audit?'<p>Usa la revisión de cada fragmento para redactar una versión que sí puedas entregar.</p>':`<div class="feedback"><h3>Qué pasó por alto la IA</h3><p>${m.issues}</p></div><h3>Tu revisión del primer intento</h3>${m.criteria.map((c,i)=>`<p><strong>${c[0]}:</strong> criterio de revisión. ${c[1]}</p>`).join('')}<p class="mut">Estos criterios son fijos. La explicación escrita requiere revisión humana; no se convierte en una nota automática.</p><details><summary>Ver una alternativa de referencia</summary><pre style="white-space:pre-wrap">${esc(m.sample)}</pre></details>`}</div><div class="card you"><span class="mine">Tu turno · Aplica la retroalimentación</span><details><summary>Editar mi propuesta (opcional)</summary>${field('revised','Tu versión mejorada',d.revised)}</details>${field('change','En tus palabras (opcional): ¿qué conservarías o cambiarías, por qué y qué verificarías?',d.change)}${scale('after',d.after)}</div>${btn('Guardar mi aprendizaje','finish',!ready())}<p class="mut">La seguridad es una percepción personal, no una medida de competencia.</p>`}
return `<div class="workspace"><button class="back" data-action="home">← Volver a las misiones (se conserva este intento)</button><p class="step-label">Paso ${state.step+1} de 3 · ${['Decide con tu criterio',audit?'Contrasta con el brief':'Prueba y compara','Mejora y reflexiona'][state.step]}</p><div class="bar"><i style="width:${(state.step+1)/3*100}%"></i></div>${body}${state.step===2?`<details class="card"><summary>Resolver una duda (opcional)</summary>${helpPanel(m,d)}</details>`:helpPanel(m,d)}</div>`}
function learning(){return `<div class="workspace"><button class="back" data-action="home">← Volver a las misiones</button><div class="eyebrow">MI APRENDIZAJE</div><h1>Haz visible lo que aprendiste.</h1><p class="mut">Tus decisiones y mejoras, sin niveles ni puntos. Este historial se guarda en este navegador; no se envía al equipo.</p>${history.length?`<div class="history-tools" aria-label="Opciones del historial"><button data-action="copy">Copiar resumen</button><span aria-hidden="true">·</span><button data-action="export">Descargar evidencia <span class="format-note">(JSON)</span></button></div><p class="export-note">Exportación opcional para revisar el test; sin certificación ni conexión institucional.</p>`:''}${history.length?history.slice().reverse().map(h=>`<div class="card"><span class="tag">${routes[h.route].title}</span><h2>${esc(h.title)}</h2><p class="mut">Seguridad percibida: ${h.before}/5 antes → ${h.after}/5 después.${Number.isFinite(h.activeSeconds)?'<br>Tiempo con la misión visible: '+Math.floor(h.activeSeconds/60)+' min '+h.activeSeconds%60+' s.':''}</p>${sessionEvidence(h)}${h.change?.trim()?`<h3>Lo que decidiste mejorar</h3><p>${esc(h.change)}</p>`:''}<details><summary>Ver mi trabajo y retroalimentación</summary><h3>Primer intento</h3><pre style="white-space:pre-wrap">${esc(h.original)}</pre><h3>Revisión</h3><p>${esc(h.feedback)}</p><h3>Versión mejorada</h3><pre style="white-space:pre-wrap">${esc(h.revised)}</pre>${h.explain?'<h3>Mi explicación</h3><p>'+esc(h.explain)+'</p>':''}${h.doubt?'<h3>Mi duda pendiente</h3><p>'+esc(h.doubt)+'</p>':''}<h3>Para la próxima</h3><p>Vuelve al brief, comprueba tus afirmaciones y explica qué evidencia respalda cada decisión.</p></details>${resourceButton(h)}</div>`).join(''):'<div class="card"><h3>Tu primera misión te espera</h3><p>Al terminar, aquí aparecerán tu reflexión y tu versión mejorada.</p></div>'}<p id="status" role="status" class="saved"></p></div>`}
function render(){document.getElementById('app').innerHTML=state.view==='home'?home():state.view==='learning'?learning():state.view==='resources'?resources():exercise();bind()}
function bind(){bindRigor();document.querySelectorAll('[data-confidence]').forEach(e=>e.onchange=()=>{draft()[e.dataset.confidence]=e.value;saveDrafts();const b=document.querySelector('[data-action="next"],[data-action="revise"],[data-action="finish"]');if(b)b.disabled=!ready()});document.querySelectorAll('[data-resources]').forEach(b=>b.onclick=()=>{state.id=b.dataset.resources;state.view='resources';render();window.scrollTo(0,0)});document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{state.route=b.dataset.route;render()});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{state.id=b.dataset.start;state.view='mission';drafts[state.id]??={before:'',after:'',answer:'',reason:'',compare:'',checks:['','',''],decisions:['','',''],reasons:['','',''],revised:'',change:'',step:0,explain:'',doubt:'',mode:'independent',auditReason:'',testVersion:'test-v5',hints:[],startedAt:Date.now(),evidence:{}};state.step=draft().step;clockAt=performance.now();render();window.scrollTo(0,0)});document.querySelectorAll('[data-field],[data-decision],[data-reason],[data-check]').forEach(e=>{const update=()=>{tickClock();const d=draft();if(e.dataset.field)d[e.dataset.field]=e.value;if(e.dataset.decision!==undefined)d.decisions[+e.dataset.decision]=e.value;if(e.dataset.reason!==undefined)d.reasons[+e.dataset.reason]=e.value;if(e.dataset.check!==undefined)d.checks[+e.dataset.check]=e.value;const b=document.querySelector('[data-action="next"],[data-action="revise"],[data-action="finish"]');if(b)b.disabled=!ready();saveDrafts()};e.oninput=update;e.onchange=update});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{tickClock();let a=b.dataset.action;if(a==='home')state.view='home';if(a==='learning')state.view='learning';if(a==='next'||a==='revise'){if(!ready())return;draft().milestones??=[];draft().milestones.push({step:state.step,at:new Date().toISOString()});state.step++;draft().step=state.step;saveDrafts()}if(a==='finish'){if(!ready())return;const m=current(),d=draft();history.push({caseVersion:'2026-11-v5',auditOrder:d.auditOrder||[],auditReason:d.auditReason||'',activeSeconds:Math.round((d.activeMs||0)/1000),elapsedSeconds:d.startedAt?Math.round((Date.now()-d.startedAt)/1000):null,mode:d.mode||'guided',hints:d.hints||[],startedAt:d.startedAt||null,completedAt:new Date().toISOString(),decisions:d.decisions.slice(),reasons:d.reasons.slice(),comparison:d.compare,evidence:d.evidence||{},milestones:d.milestones||[],id:m.id,explain:d.explain||'',doubt:d.doubt||'',route:m.route,title:m.title,before:d.before,after:d.after,original:m.type==='compare'?d.answer+'\nRazonamiento: '+d.reason:auditEntries(m,d).map(({c,i},j)=>'Fragmento '+(j+1)+': '+c[0]+'\nDecisión: '+d.decisions[i]).join('\n\n')+'\nJustificación conjunta: '+(d.auditReason||''),feedback:m.type==='compare'?m.criteria.map((c,i)=>c[0]+': '+'Criterio fijo'+'. '+c[1]).join(' '):m.claims.map((c,i)=>'Fragmento '+(i+1)+': '+c[2]).join(' '),revised:d.revised,change:d.change});try{localStorage.setItem('worksim-learning-v2',JSON.stringify(history))}catch{alert('El navegador no permitió guardar el historial. Puedes copiar el resumen antes de salir.')}delete drafts[state.id];saveDrafts();state.view='learning'}if(a==='resources'){state.view='resources'}if(a==='export'){exportEvidence();return}if(a==='copy'){try{await navigator.clipboard.writeText(history.map(h=>h.title+'\nSeguridad: '+h.before+' → '+h.after+'\nPrimer intento: '+h.original+'\nRevisión: '+h.feedback+'\nVersión mejorada: '+h.revised+'\nReflexión: '+h.change+'\nExplicación: '+(h.explain||'')+'\nDuda pendiente: '+(h.doubt||'')).join('\n\n'));document.getElementById('status').textContent='Resumen copiado.'}catch{document.getElementById('status').textContent='No se pudo copiar automáticamente. Puedes seleccionar el texto del historial.'}return}render();window.scrollTo(0,0)})}

 message:{question:'¿Qué diferencia hay entre una afirmación incorrecta y otra que todavía necesita verificarse?',topic:'Publicar solo lo que puedes sostener',guide:'Contrasta cada afirmación con el brief. Si lo contradice, corrígela. Si no está respaldada, busca una fuente válida antes de usarla. Si coincide con la información confirmada y no induce a confusión, puedes conservarla. No necesitas encontrar errores en todo.',check:['Subraya fechas, cifras y promesas.','Busca de dónde sale cada afirmación.','Elimina o reformula lo que no puedas sostener antes de publicar.'],example:'Otro caso: un curso presencial tiene 12 cupos y no incluye materiales. “Incluye todos los materiales” contradice el encargo. “El favorito de la ciudad” necesita evidencia. “12 cupos presenciales” coincide con la información disponible.',links:[['FTC · Publicidad y evidencia','https://www.ftc.gov/business-guidance/advertising-marketing/advertising-marketing-basics','Referencia de EE. UU. · Inglés. Introducción al respaldo de afirmaciones; no es normativa ecuatoriana.'],['Google · Mapear objetivos de medición','https://services.google.com/fh/files/misc/map_your_measurement_goals_en.pdf','PDF · Inglés. Conecta lo que comunicas con el resultado que quieres conseguir.']]}

function completed(m){return history.some(h=>h.id===m.id||h.title===m.title)}
function pathway(){const list=missions.filter(m=>m.route===state.route),n=list.filter(completed).length;return `<section class="card pathway"><div class="navline"><div style="flex:1"><span class="eyebrow">TU RUTA DE APRENDIZAJE</span><h3>${routes[state.route].title}</h3></div><strong>${n} de ${list.length} misiones</strong></div><progress value="${n}" max="${list.length}" aria-label="Misiones completadas en ${routes[state.route].title}"></progress><p class="mut">Catálogo de casos preparado para este prototipo; todavía no es una base validada del mercado laboral. Mide actividades completadas, no tu nivel de dominio. Orden sugerido; puedes empezar por cualquiera.</p><ol>${list.slice().sort((a,b)=>a.type==='audit'?-1:1).map((m,i)=>`<li><strong>${m.id.includes('dialogue')?'Comunica y negocia':m.type==='audit'?'Reconoce y justifica':'Resuelve, contrasta y mejora'}</strong><span>${esc(m.title)} · ${completed(m)?'Completada':drafts[m.id]?'En curso':'Por explorar'}</span></li>`).join('')}<li><strong>Consolida lo aprendido</strong><span>Explica con tus palabras y consulta los recursos al terminar cada misión.</span></li></ol></section>`}
function helpPanel(m,d){if((d.mode||'guided')==='independent'&&state.step<(m.type==='audit'?1:2))return `<aside class="card help"><h3>Revisión independiente</h3><p>Las explicaciones y ejemplos se desbloquean después de entregar tu diagnóstico. Usa el brief para justificarlo.</p>${field('doubt','Mi duda pendiente (opcional)',d.doubt||'')}</aside>`;const t=support[m.id];return `<aside class="card help"><span class="eyebrow">ESPACIO DE DUDAS</span><h3>Necesito entender…</h3><p class="mut">Abre una orientación. Tú sigues tomando la decisión; son ayudas preparadas para este caso.</p><details data-help="encargo"><summary>El encargo: ¿por dónde empiezo?</summary><p>Antes de responder: ¿qué debes entregar, para quién y con qué restricciones? Escribe tres requisitos del brief y decide cómo comprobarías cada uno.</p></details><details data-help="verificar"><summary>Cómo comprobar una afirmación</summary><p>¿Qué dato del brief la respalda? Si no aparece, ¿qué fuente necesitarías? Distingue lo confirmado de lo que todavía es una suposición.</p><p>${esc(m.hint)}</p></details><details data-help="ejemplo"><summary>Cómo entender el concepto con otro ejemplo</summary><p>${esc(t.example)}</p></details><details><summary>Tengo otra duda o quiero anotar algo</summary>${field('doubt','Mi duda pendiente (opcional)',d.doubt||'')}<p class="mut">Esta nota se guardará con tu misión. No es un chat ni se responderá automáticamente; puedes llevarla a tu docente o consultarla con los recursos.</p></details></aside>`}
function resourceButton(h){const m=missions.find(m=>m.id===h.id||m.title===h.title);return m?`<button class="btn next-step" data-resources="${m.id}">Tu siguiente paso · ${support[m.id].topic} →</button>`:''}
function resources(){const m=current(),t=support[m.id];return `<div class="workspace"><button class="back" data-action="learning">← Volver a Mi aprendizaje</button><div class="eyebrow">TU SIGUIENTE PASO</div><h1>${t.topic}</h1><p class="mut">Recursos para la misión: ${esc(m.title)}. Elige qué reforzar; no necesitas leerlo todo.</p><article class="card"><span class="tag">Guía breve · En español</span><h2>Comprende la idea</h2><p>${t.guide}</p><h3>Un ejemplo diferente</h3><p>${t.example}</p><h3>Antes de entregar tu próximo trabajo</h3><ul>${t.check.map(x=>`<li>${x}</li>`).join('')}</ul></article><section class="card"><h2>Para investigar más</h2>${t.links.map(([title,url,why])=>`<div class="review-row"><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a><p class="mut">${esc(why)}</p></div>`).join('')}<p class="mut">Lecturas externas seleccionadas como complemento. La guía en español de arriba permite repasar sin salir de WORKSIM.</p></section><div class="card you"><h3>Llévalo a otra situación</h3><p>${t.question}</p><p class="mut">Piensa en un ejemplo propio y explícaselo a alguien sin apoyarte en la respuesta de la IA.</p></div><button class="btn" data-action="home">Elegir mi próxima misión</button></div>`}

function sessionEvidence(h){const m=missions.find(m=>m.id===h.id||m.title===h.title);let text='';if(m?.type==='audit'&&h.decisions){const matching=m.claims.filter((c,i)=>c[1]===h.decisions[i]).length;const problematic=m.claims.map((c,i)=>({c,i})).filter(x=>x.c[1]!=='accept');const detected=problematic.filter(x=>h.decisions[x.i]&&h.decisions[x.i]!=='accept').length;const fp=m.claims.filter((c,i)=>c[1]==='accept'&&h.decisions[i]&&h.decisions[i]!=='accept').length;text=`<p><strong>Decisiones que coinciden con el caso:</strong> ${matching}/${m.claims.length}.<br>Fragmentos problemáticos cuestionados: ${detected}/${problematic.length}. Alertas sobre fragmentos correctos: ${fp}.</p><p class="mut">Cuenta decisiones, no demuestra la calidad de sus razones ni certifica pensamiento crítico.</p>`}return `<div class="evidence"><p><strong>Modalidad:</strong> ${h.mode==='independent'?'Revisión independiente':h.mode==='guided'?'Con ayudas disponibles':'Sesión anterior sin registro de ayudas'} · Ayudas abiertas: ${h.hints?.length??'sin registro'}.</p>${text}${h.evidence?.sql?'<p>Pruebas SQL ejecutadas y guardadas. Consulta el detalle en la exportación.</p>':''}</div>`}
function sandbox(d){return `<section class="card" style="margin-top:20px"><span class="tag">SQL real · SQLite en tu navegador</span><h3>Comprueba tu hipótesis</h3><p>Ejecuta tu consulta y la de la IA sobre dos conjuntos de 90 registros ficticios. Los resultados se calculan al ejecutar; los casos no prueban equivalencia para todas las bases posibles.</p><button class="btn ghost" data-run="mine">Ejecutar mi primer intento</button><button class="btn ghost" data-run="ai">Ejecutar la consulta de la IA</button><label for="trial">Consulta para experimentar (opcional)</label><textarea id="trial" data-field="trial">${esc(d.trial||d.answer)}</textarea><button class="btn ghost" data-run="trial">Ejecutar mi corrección</button><div id="sql-result" aria-live="polite">${d.lastSql?sqlResult(d.lastSql):''}</div></section>`}
function sqlResult(r){if(r.error)return `<div class="res no"><strong>No se pudo ejecutar</strong>${esc(r.error)}</div>`;return r.variants.map(v=>`<h3>Conjunto de prueba ${v.variant}</h3>${v.checks.map(([title,pass])=>`<div class="res ${pass?'ok':'no'}"><strong>${pass?'✓ Pasa':'✗ No pasa'} · ${esc(title)}</strong></div>`).join('')}<details><summary>Ver filas e IDs del resultado</summary><p class="mut">IDs esperados: ${v.expectedIds.join(', ')}. Filas obtenidas: ${v.values.length}.</p><div style="overflow:auto"><table><thead><tr>${v.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${v.values.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`).join('')}
function bindRigor(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});document.querySelectorAll('[data-help]').forEach(el=>el.ontoggle=()=>{if(el.open){const d=draft();d.hints??=[];if(!d.hints.some(h=>h.key===el.dataset.help&&h.step===state.step))d.hints.push({key:el.dataset.help,step:state.step,at:new Date().toISOString()});saveDrafts()}});document.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{const d=draft(),kind=b.dataset.run,query=kind==='mine'?d.answer:kind==='ai'?current().ai:(d.trial||d.answer);const out=document.getElementById('sql-result');out.textContent='Ejecutando en una base de práctica aislada…';document.querySelectorAll('[data-run]').forEach(x=>x.disabled=true);const worker=new Worker('./sql-worker.js');let finished=false;const done=r=>{if(finished)return;finished=true;clearTimeout(timeout);worker.terminate();d.lastSql=r;d.evidence??={};d.evidence.sql??=[];d.evidence.sql.push({target:kind,query,at:new Date().toISOString(),result:r});saveDrafts();out.innerHTML=sqlResult(r);document.querySelectorAll('[data-run]').forEach(x=>x.disabled=false)};const timeout=setTimeout(()=>done({error:'La ejecución superó 8 segundos. Revisa la consulta e inténtalo de nuevo.'}),8000);worker.onmessage=e=>done(e.data);worker.onerror=()=>done({error:'No se pudo iniciar SQLite. Recarga la página e inténtalo de nuevo.'});worker.postMessage({query})})}
function exportEvidence(){const payload={schema:'worksim-evidence-v1',exportedAt:new Date().toISOString(),scope:'Sesiones locales voluntariamente exportadas; sin certificación',sessions:history};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='worksim-evidencia.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function auditEntries(m,d){if(!d.auditOrder){d.auditOrder=m.claims.map((_,i)=>i);for(let i=d.auditOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d.auditOrder[i],d.auditOrder[j]]=[d.auditOrder[j],d.auditOrder[i]]}saveDrafts()}return d.auditOrder.map(i=>({i,c:m.claims[i]}))}
let clockAt=performance.now();
function tickClock(){const now=performance.now();if(state.view==='mission'&&state.id&&draft()){draft().activeMs=(draft().activeMs||0)+(document.hidden?0:now-clockAt)}clockAt=now}
document.addEventListener('visibilitychange',()=>{const now=performance.now();if(document.hidden&&state.view==='mission'&&draft()){draft().activeMs=(draft().activeMs||0)+(now-clockAt);saveDrafts()}clockAt=now});window.addEventListener('pagehide',()=>{tickClock();saveDrafts()});
render();
</script></body></html>
