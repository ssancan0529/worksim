<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORKSIM · Entrenamiento profesional</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#161a22;--mut:#5b6372;--line:#dde1e8;--pri:#111;--prit:#fff;--you:#2f5bd8;--youbg:#eef3ff;--ok:#1f7a4d;--okbg:#e4f4ea;--bad:#b3261e;--badbg:#fbe6e4;--code:#eef0f5;--mark:#fff1c2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--card:#1c2029;--tx:#e8ebf1;--mut:#a9b2c1;--line:#2c3240;--pri:#f2f3f5;--prit:#111;--you:#7c9cff;--youbg:#1b2440;--ok:#6fd49c;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1c1a;--code:#232836;--mark:#4a3f12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161c;--card:#1c2029;--tx:#e8ebf1;--mut:#a9b2c1;--line:#2c3240;--pri:#f2f3f5;--prit:#111;--you:#7c9cff;--youbg:#1b2440;--ok:#6fd49c;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1c1a;--code:#232836;--mark:#4a3f12;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:660px;margin:0 auto;padding:0 16px 44px}
.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:14px 0}
.hd b{font-size:19px;letter-spacing:.5px}
.chip{font-size:12px;background:var(--okbg);color:var(--ok);border-radius:20px;padding:4px 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card.lock{background:transparent;border-style:dashed;border-color:var(--mut)}
.card.lock h3{color:var(--tx)}
h1{font-size:26px;line-height:1.2;margin:6px 0 8px}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:17px;margin:2px 0 6px}
p{margin:0 0 10px}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;background:var(--code);border-radius:6px;padding:2px 8px;color:var(--mut);margin:0 6px 8px 0}
pre,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
pre{background:var(--code);border-radius:10px;padding:12px;margin:8px 0;overflow-x:auto;white-space:pre}
button{font:inherit;cursor:pointer}
.btn{width:100%;background:var(--pri);color:var(--prit);border:0;border-radius:12px;padding:14px;font-weight:600;margin-top:6px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--mut);padding:4px 0 10px;font-size:14px}
.bar{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--you);transition:width .3s}
.role{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lvl{background:var(--code);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:4px 0 14px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:14px}
.tabs button.on{background:var(--pri);color:var(--prit);border-color:var(--pri)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--code);border-radius:10px;padding:12px;margin:10px 0;font-size:14px}
.meta span{display:block;font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips i{font-style:normal;font-size:13px;background:var(--code);border-radius:6px;padding:3px 9px}
.soon{float:right;font-size:12px;font-weight:600;color:var(--tx);border:1px solid var(--mut);border-radius:20px;padding:2px 10px}
.stat{display:flex;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0}
.stat big{font-size:26px;font-weight:700;min-width:62px}
.you{border:2px solid var(--you);background:var(--youbg)}
.you .mine{display:inline-block;font-size:12px;font-weight:700;background:var(--you);color:var(--bg);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.ro{display:inline-block;font-size:12px;background:var(--code);color:var(--mut);border-radius:6px;padding:2px 8px;margin-left:6px;vertical-align:middle}
textarea{width:100%;min-height:150px;border:2px solid var(--you);border-radius:10px;padding:10px;background:var(--card);color:var(--tx);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
textarea.txt{font:15px/1.5 system-ui,sans-serif;min-height:72px}
.scale{display:flex;gap:8px;margin:10px 0 4px}
.scale button{flex:1;padding:13px 0;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600}
.scale button.on{background:var(--you);color:var(--bg);border-color:var(--you)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:12px;margin:6px 0}
.opt.on{border-color:var(--you);outline:2px solid var(--you)}
.code{background:var(--code);border-radius:10px;padding:6px 0;margin:8px 0;overflow-x:auto}
.ln{display:flex;gap:10px;padding:4px 12px;border:0;background:transparent;color:var(--tx);width:100%;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre}
.ln b{color:var(--mut);font-weight:400;min-width:14px}
button.ln{cursor:pointer}
button.ln.on{background:var(--mark);box-shadow:inset 3px 0 0 var(--you)}
.ln.bad{background:var(--badbg)}
.ln.hit{background:var(--okbg)}
.res{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.res.ok{background:var(--okbg);color:var(--ok)}
.res.no{background:var(--badbg);color:var(--bad)}
.res strong{display:block}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:15px}
.chk input{margin-top:4px;width:18px;height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><b>WORKSIM</b><span class="chip">Práctica privada · sin nota</span></div>
  <div id="app"></div>
</div>
<script>
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const init=()=>({view:'portal',tab:'all',step:0,before:null,after:null,code1:'',pick:'',diff:'',chk:[false,false,false],marks:[],none:false,why:'',feel:'',note:'',done:false});
const S=init();
const TOTAL=6;
const MIS=[
 {tag:'Análisis de datos',co:'Banco Horizonte (banco simulado)',t:'Un reporte que no cuadra',d:'Revisarás la consulta de transferencias para un reporte de riesgo y la función que registra retiros, antes de entregar a tu líder de equipo.',c:['bk','ai'],open:true},
 {tag:'Machine Learning',t:'Un modelo de riesgo con métricas demasiado buenas',d:'Revisión de fuga de datos y métricas de un modelo de scoring generado con ayuda de IA.',c:['bk','ai']},
 {tag:'Datos y reportes',t:'Un reporte de fraude con cifras inconsistentes',d:'Cruce de fuentes y validación de duplicados en un reporte armado con apoyo de IA.',c:['bk']},
 {tag:'Q3',t:'Conciliación de movimientos entre dos sistemas',d:'',c:['bk']}
];
const AI1=`SELECT *
FROM (
  SELECT * FROM transacciones
  LIMIT 10 OFFSET 10
) AS pagina
WHERE tipo = 'transferencia'
ORDER BY sospechosa DESC;`;
const AI2=[
"def retirar(cuenta_id, monto):",
"    cuenta = db.buscar_cuenta(cuenta_id)",
"    if cuenta is None:",
"        return 404",
"    db.registrar_retiro(cuenta_id, monto)",
"    cuenta['saldo'] = cuenta['saldo'] - monto",
"    db.guardar_cuenta(cuenta)",
"    return 201"];
/* SHOW: líneas que se resaltan como problema. P1 acepta 4 o 5 (el chequeo faltante va entre ambas). */
const SHOW=[5,6,7], P1=[4,5], P2=[6,7], ALL=[...P1,...P2];
const scale=k=>`<div class="scale">${[1,2,3,4,5].map(n=>`<button data-scale="${k}" data-v="${n}" class="${S[k]===n?'on':''}">${n}</button>`).join('')}</div><div class="ends"><span>Nada seguro/a</span><span>Muy seguro/a</span></div>`;
const nav=(l,d)=>`<button class="btn" data-go="1" ${d?'disabled':''}>${l}</button>`;
const test=(ok,t,d)=>`<div class="res ${ok?'ok':'no'}"><strong>${ok?'✓':'✗'} ${t}</strong>${d}</div>`;
const hits=()=>[P1,P2].filter(p=>p.some(n=>S.marks.includes(n))).length;
const exN=()=>S.marks.filter(n=>!ALL.includes(n)).length;
const okD=()=>exN()<3;

function portal(){
  const list=MIS.filter(m=>S.tab==='all'||m.c.includes(S.tab));
  const cards=list.map(m=>m.open?`<div class="card"><span class="tag">${m.tag}</span><span class="tag">Misión disponible</span>
<p class="mut">Empresa simulada: <strong>${m.co}</strong></p><h2>${m.t}</h2><p class="mut">${m.d}</p>
<div class="meta"><div><span>Dificultad</span>Intermedia</div><div><span>Duración</span>20 minutos</div><div><span>Ambiente</span>SQL y Python</div></div>
<div class="chips"><i>Pensamiento crítico</i><i>Criterio técnico</i><i>Evaluación de IA</i><i>Detección de edge cases</i></div>
<p class="mut">Dos ejercicios: primero escribes una consulta SQL y comparas con la IA, luego buscas errores en una función de Python que escribió la IA. Tus resultados no cuentan como nota.</p>
<button class="btn" data-start="1">${S.done?'Repetir la práctica':'Iniciar práctica'}</button></div>`
  :`<div class="card lock"><span class="soon">Próximamente</span><span class="tag">${m.tag}</span><h3>${m.t}</h3>${m.d?`<p class="mut">${m.d}</p>`:''}</div>`).join('');
  return `<h1>Bienvenido a tu espacio de entrenamiento profesional</h1>
<p class="mut">Enfrenta situaciones reales, cuestiona a la IA y demuestra tu criterio. Aquí practicas sin presión.</p>
<div class="card role"><div><span class="mut">Rol de sesión activo</span><h3>Analista de Datos Junior</h3></div><span class="lvl">Práctica</span></div>
<div class="tabs">${[['all','Todas las misiones'],['bk','Datos y lógica'],['ai','Auditoría IA']].map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</div>
${cards}
<div class="card"><div class="stat"><big>${S.done?1:0}</big><div>Misiones completadas<br><span class="mut">Sin mínimo: avanza a tu ritmo</span></div></div>
<div class="stat"><big>${S.done?(okD()?hits()+'/2':'—'):'-'}</big><div>Problemas de la IA que detectaste<br><span class="mut">${S.done?(okD()?'Ejercicio 2. No cuenta como nota.':'Sin validar por exceso de líneas marcadas. No cuenta como nota.'):'Se calcula en la Misión 01'}</span></div></div>
<div class="stat"><big>✓</big><div>Modo práctica<br><span class="mut">Aquí equivocarte no cuesta nada y no afecta ninguna nota.</span></div></div></div>`;
}
function codeTap(){return `<div class="code">${AI2.map((l,i)=>`<button class="ln ${S.marks.includes(i+1)?'on':''}" data-line="${i+1}"><b>${i+1}</b>${esc(l)}</button>`).join('')}</div>`}
function codeRev(){return `<div class="code">${AI2.map((l,i)=>{const n=i+1,r=SHOW.includes(n),m=S.marks.includes(n);const c=r?(m?'hit':'bad'):(m&&ALL.includes(n)?'hit':'');return `<div class="ln ${c}"><b>${n}</b>${esc(l)}</div>`}).join('')}</div>`}

const M={
0:()=>`<div class="card"><span class="tag">Misión 01 · Banco Horizonte</span><h2>Un reporte que no cuadra</h2>
<p>Eres analista de datos junior en Banco Horizonte, un banco inventado. Tu líder de equipo necesita el reporte de transferencias y el registro de retiros funcionando antes de la reunión de riesgo.</p>
<p class="mut">Verás dos tipos de ejercicio. En el primero escribes tu versión y luego ves la de la IA. En el segundo buscas los problemas tú solo, sin pistas. Lo azul es siempre tu turno.</p></div>
<div class="card you"><span class="mine">Tu turno</span><h3>Antes de empezar</h3><p>¿Qué tan seguro/a te sientes revisando código que escribió una IA?</p>${scale('before')}</div>
${nav('Empezar',!S.before)}`,
1:()=>`<div class="card"><span class="tag">Ejercicio 1 de 2 · Resuelve tú primero</span><h3>El pedido de tu líder de equipo</h3>
<p>Escribe la consulta que devuelve la <strong>página 2</strong> de las <strong>transferencias de Guayaquil</strong>, con las <strong>sospechosas primero</strong>, de <strong>10 en 10</strong>.</p>
<pre>transacciones(id, cuenta_id, tipo, ciudad, monto, sospechosa, fecha)
-- sospechosa: 1 si fue marcada para revisión, 0 si no
-- tipo: 'transferencia', 'retiro' o 'deposito'
-- hay al menos 25 transferencias de Guayaquil y unas 60 filas más en la tabla</pre></div>
<div class="card you"><span class="mine">Tu turno</span><h3>Tu consulta</h3><p class="mut">Escríbela como te salga. Si dudas en una parte, déjala como puedas.</p>
<textarea data-bind="code1" spellcheck="false" placeholder="SELECT ...">${esc(S.code1)}</textarea></div>
${nav('Ver lo que hizo la IA',!S.code1.trim())}`,
2:()=>`<div class="card"><span class="tag">Ejercicio 1 de 2 · Compara</span><h3>El pedido</h3><p>Escribe la consulta que devuelve la <strong>página 2</strong> de las <strong>transferencias de Guayaquil</strong>, con las <strong>sospechosas primero</strong>, de <strong>10 en 10</strong>.</p></div>
<div class="card"><h3>Tu versión <span class="ro">lo que escribiste</span></h3><pre>${esc(S.code1)}</pre></div>
<div class="card"><h3>La consulta de la IA <span class="ro">solo lectura</span></h3>
<p class="mut">La IA respondió con total seguridad y la consulta corre sin errores.</p><pre>${esc(AI1)}</pre></div>
<div class="card you"><span class="mine">Tu turno</span><h3>¿Cuál cumple mejor el pedido?</h3>
${['La mía','La de la IA','Ninguna está del todo bien','No lo sé'].map(o=>`<button class="opt ${S.pick===o?'on':''}" data-pick="${o}">${o}</button>`).join('')}
<p class="mut" style="margin-top:12px">¿Qué diferencias ves entre las dos? (opcional)</p><textarea class="txt" data-bind="diff">${esc(S.diff)}</textarea></div>
${nav('Ver las pruebas y la revisión',!S.pick)}`,
3:()=>`<div class="card"><span class="tag">Ejercicio 1 de 2 · Pruebas</span><h3>Pruebas contra el código de la IA</h3><p class="mut">Datos de prueba simulados.</p>
${test(1,'Filtra por tipo de transacción','Pasa.')}
${test(0,'Filtra por ciudad','Esperado: solo transacciones de Guayaquil. Obtenido: incluye transacciones de Quito.')}
${test(0,'La página 2 de transferencias de Guayaquil devuelve 10 filas','Esperado: 10. Obtenido: 3.')}
${test(0,'Las sospechosas salen primero en toda la lista','Esperado: la transacción sospechosa #23 aparece en la página 1. Obtenido: aparece en la página 3.')}</div>
<div class="card"><h3>Qué había detrás</h3>
<p><strong>Paginación prematura.</strong> El LIMIT y el OFFSET están en una subconsulta que corre antes del WHERE: toma 10 filas cualquiera y recién después filtra, así que la página trae menos de 10 y se pierden transferencias que sí cumplen. Lo correcto es filtrar y ordenar primero, y poner LIMIT y OFFSET al final.</p>
<p><strong>Ciudad omitida.</strong> El pedido era de transferencias de Guayaquil, pero la consulta solo filtra por tipo.</p>
<p><strong>Orden solo dentro de la página.</strong> El ORDER BY de afuera solo reordena esas 10 filas, así que las sospechosas que quedaron en otras páginas nunca suben al principio. Debe ir junto al WHERE, antes de LIMIT.</p><p class="mut">Una forma correcta de escribirla:</p><pre>SELECT * FROM transacciones
WHERE tipo = 'transferencia' AND ciudad = 'Guayaquil'
ORDER BY sospechosa DESC, id
LIMIT 10 OFFSET 10;</pre><p class="mut">Hay más de una manera válida.</p></div>
<div class="card you"><span class="mine">Tu turno</span><h3>Mira tu versión</h3><p class="mut">Marca lo que la tuya sí cubría. Es solo para ti.</p>
${['Filtré por tipo y ciudad','Filtré antes de paginar','Ordené las sospechosas antes de paginar'].map((t,i)=>`<label class="chk"><input type="checkbox" data-chk="${i}" ${S.chk[i]?'checked':''}> <span>${t}</span></label>`).join('')}</div>
${nav('Pasar al ejercicio 2')}`,
4:()=>`<div class="card"><span class="tag">Ejercicio 2 de 2 · Encuentra los problemas</span><h3>El pedido</h3>
<p>La función de Python <span class="mono">retirar</span> registra un retiro. <strong>Una cuenta no puede quedar con saldo negativo</strong>: si el monto supera el saldo, debe devolver 409. Debe funcionar bien aunque dos retiros lleguen al mismo tiempo.</p></div>
<div class="card you"><span class="mine">Tu turno: toca y escribe</span><h3>Código de la IA</h3><p class="mut">Toca las líneas donde crees que está el problema, o donde pondrías la corrección. Puede haber ninguna, una o varias. No hay etiquetas de ayuda.</p>
${codeTap()}
<button class="opt ${S.none?'on':''}" data-none="1">No veo ningún problema</button>
<p class="mut" style="margin-top:12px">¿Por qué crees que falla? Escribe tu hipótesis.</p><textarea class="txt" data-bind="why">${esc(S.why)}</textarea></div>
${nav('Correr las pruebas',!(S.marks.length||S.none||S.why.trim()))}`,
5:()=>{const h=hits(),ex=S.marks.filter(n=>!ALL.includes(n)).length;
return `<div class="card"><span class="tag">Ejercicio 2 de 2 · Pruebas</span><h3>Pruebas contra el código de la IA</h3><p class="mut">Datos de prueba simulados.</p>
${test(1,'Una cuenta inexistente devuelve 404','Pasa.')}
${test(0,'Un retiro mayor al saldo devuelve 409','Esperado: 409. Obtenido: 201.')}
${test(0,'Dos retiros simultáneos de $80 sobre un saldo de $100 dejan un solo retiro','Esperado: 1 retiro y saldo $20. Obtenido: 2 retiros registrados por $160 en total y saldo $20, inconsistente con lo retirado.')}</div>
<div class="card"><h3>Dónde estaban los problemas</h3>${codeRev()}
<p><strong>Entre las líneas 4 y 5:</strong> falta revisar si el saldo alcanza. La línea 5 registra el retiro sin chequearlo, y debería devolver 409. Marcar la 4 o la 5 cuenta como acierto.</p>
<p><strong>Líneas 6 y 7:</strong> leer el saldo, restar y guardar no es atómico. Si llegan dos retiros a la vez, los dos leen el mismo saldo y los dos pasan. Se resuelve con un UPDATE condicional, por ejemplo UPDATE cuentas SET saldo = saldo - ? WHERE id = ? AND saldo &gt;= ?, revisando cuántas filas cambió: si fueron 0, devuelve 409; si fue 1, registra el retiro en la misma transacción. Una restricción CHECK (saldo &gt;= 0) en la tabla sirve como red de seguridad.</p>
<p class="mut">Problemas identificados: ${h} de 2. Líneas adicionales marcadas: ${ex}. Resultado de la detección: ${okD()?'validado':'no validado por exceso de selecciones'}. Esto no cuenta como nota.</p></div>
${nav('Terminar')}`},
6:()=>{const sum=`WORKSIM · resumen de la sesión (Misión 01 Banco Horizonte)
Seguridad antes (1-5): ${S.before}
Seguridad después (1-5): ${S.after||'-'}

EJERCICIO 1
Mi consulta:
${S.code1||'-'}
Quién cumple mejor: ${S.pick||'-'}
Diferencias que vi: ${S.diff||'-'}
Mi versión cubría: ${['filtros','filtrar antes de paginar','ordenar sospechosas antes de paginar'].filter((_,i)=>S.chk[i]).join(', ')||'ninguno'}

EJERCICIO 2
Líneas marcadas: ${S.none||!S.marks.length?'ninguna':[...S.marks].sort((a,b)=>a-b).join(', ')} (reales: chequeo entre 4 y 5, y 6 y 7)
Detección: ${hits()} de 2, líneas adicionales: ${exN()}, ${okD()?'validada':'no validada por exceso de selecciones'}
Mi hipótesis: ${S.why||'-'}

CIERRE
Cómo me sentí: ${S.feel||'-'}
Algo que me confundió: ${S.note||'-'}`;
return `<div class="card you"><span class="mine">Tu turno</span><h3>Para terminar</h3>
<p>¿Y ahora, qué tan seguro/a te sientes revisando código de una IA?</p>${scale('after')}
<p style="margin-top:14px">¿Cómo te sentiste durante la práctica?</p>
${['Cómodo/a','Normal','Presionado/a'].map(o=>`<button class="opt ${S.feel===o?'on':''}" data-feel="${o}">${o}</button>`).join('')}
<p class="mut" style="margin-top:12px">¿Algo te confundió? (opcional)</p><textarea class="txt" data-bind="note">${esc(S.note)}</textarea></div>
<div class="card"><h3>Resumen para el equipo</h3><p class="mut">Solo se comparte si tú decides copiarlo y enviarlo a quien aplica el test. Incluye tus respuestas escritas.</p>
<textarea id="sum" readonly style="min-height:300px;border-color:var(--line)">${esc(sum)}</textarea>
<button class="btn ghost" id="cp" ${S.after?'':'disabled'}>Copiar resumen</button>
${S.after?'':'<p class="mut">Elige tu seguridad de 1 a 5 para copiar el resumen y terminar.</p>'}<button class="btn" id="fin" ${S.after?'':'disabled'}>Volver al portal</button></div>`}
};

function render(){
  const a=document.getElementById('app');
  if(S.view==='portal'){a.innerHTML=portal()}
  else{a.innerHTML=`<button class="back" data-home="1">← Volver al portal</button><div class="bar"><i style="width:${S.step/TOTAL*100}%"></i></div>`+M[S.step]()}
  a.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{Object.assign(S,init(),{view:'mision',done:S.done});render();window.scrollTo(0,0)});
  a.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{S.view='portal';render();window.scrollTo(0,0)});
  a.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  a.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.step++;render();window.scrollTo(0,0)});
  a.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>{S[b.dataset.scale]=+b.dataset.v;render()});
  a.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.pick=b.dataset.pick;render()});
  a.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{S.feel=b.dataset.feel;render()});
  a.querySelectorAll('[data-chk]').forEach(b=>b.onchange=()=>{S.chk[+b.dataset.chk]=b.checked});
  a.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{const n=+b.dataset.line;S.none=false;S.marks=S.marks.includes(n)?S.marks.filter(x=>x!==n):[...S.marks,n];render()});
  a.querySelectorAll('[data-none]').forEach(b=>b.onclick=()=>{S.none=!S.none;if(S.none)S.marks=[];render()});
  a.querySelectorAll('[data-bind]').forEach(t=>t.oninput=()=>{S[t.dataset.bind]=t.value;const go=a.querySelector('[data-go]');if(go){if(t.dataset.bind==='code1')go.disabled=!S.code1.trim();if(t.dataset.bind==='why')go.disabled=!(S.marks.length||S.none||S.why.trim())}});
  const cp=document.getElementById('cp');
  if(cp)cp.onclick=async()=>{const t=document.getElementById('sum');try{await navigator.clipboard.writeText(t.value);cp.textContent='Copiado'}catch(e){t.select();cp.textContent='Selecciona y copia el texto'}};
  const fin=document.getElementById('fin');
  if(fin)fin.onclick=()=>{S.done=true;S.view='portal';render();window.scrollTo(0,0)};
}
render();
</script>
</body>
</html>
